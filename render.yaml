#################################################################
# AuditX — Render Blueprint
# Deploy:  render.yaml is auto-detected when you connect this repo
#          (https://github.com/HarshBuild/AuditX) on Render.
# Creates two services:
#   auditx-api  — Node.js Express API  (Web Service, free plan)
#   auditx-web  — React dashboard       (Static Site, free plan)
#
# After first deploy: copy the auditx-web onrender.com URL into the
# auditx-api FRONTEND_URL env var and redeploy the API.
#################################################################

envVarGroups:
  - name: auditx-supabase-web
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false            # Supabase Dashboard → Project Settings → Data API → Project URL
      - key: VITE_SUPABASE_ANON_KEY
        sync: false            # publishable key (sb_publishable_...)
      - key: VITE_AUDITX_API_URL
        sync: false            # e.g. https://auditx-api.onrender.com (set after API deploys)

services:
  # --------------------------- API ---------------------------
  - type: web
    name: auditx-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend/firebase/functions
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Supabase backend (Dashboard → Project Settings → Data API + API Keys).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: scans
      # Gemini (https://aistudio.google.com/apikey)
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_VISION_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.6-flash
      # Set to the auditx-web URL after the first deploy, e.g. https://auditx.onrender.com
      - key: FRONTEND_URL
        sync: false

  # ------------------------- Dashboard ------------------------
  - type: web
    name: auditx-web
    runtime: static
    plan: free
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - fromGroup: auditx-supabase-web