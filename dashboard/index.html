    <title>AuditX — Legal Metrology Compliance Inspection</title>
    <style>
      /* App splash shown while the single-file bundle boots; React replaces it. */
      #root:empty {
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      #root:has(.auditx-splash) {
        min-height: 100dvh;
      }
      .auditx-splash {
        position: relative;
        overflow: hidden;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        background:
          radial-gradient(1100px 620px at 50% -12%, rgb(18 48 89 / 0.9) 0%, transparent 60%),
          linear-gradient(160deg, #0b1324 0%, #0d1d3d 55%, #070d1d 100%);
        color: #ffffff;
      }
      .auditx-splash::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgb(148 163 184 / 0.12) 1px, transparent 1px);
        background-size: 22px 22px;
        pointer-events: none;
      }
      .auditx-splash__inner {
        position: relative;
        z-index: 1;
        text-align: center;
        padding: 24px;
      }
      .auditx-splash__tile {
        position: relative;
        width: 84px;
        height: 84px;
        margin: 0 auto 18px;
        border-radius: 22px;
        background: linear-gradient(135deg, #4f9bff 0%, #2563eb 45%, #1e3a8a 100%);
        box-shadow: 0 18px 44px -12px rgb(37 99 235 / 0.6), 0 0 32px -6px rgb(79 155 255 / 0.5);
        display: grid;
        place-items: center;
        animation: auditx-pop 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .auditx-splash__tile::after {
        content: '';
        position: absolute;
        inset: -10px;
        border-radius: 30px;
        border: 2px solid rgb(96 165 250 / 0.4);
        border-top-color: rgb(147 197 253 / 0.9);
        animation: auditx-ring 1.6s linear infinite;
      }
      .auditx-splash__mark {
        width: 46px;
        height: 46px;
      }
      .auditx-splash__mark path {
        stroke-dasharray: 40;
        stroke-dashoffset: 40;
      }
      .auditx-splash__mark path:nth-of-type(1) {
        animation: auditx-draw 0.55s ease-out 0.15s forwards;
      }
      .auditx-splash__mark path:nth-of-type(2) {
        animation: auditx-draw 0.55s ease-out 0.4s forwards;
      }
      @keyframes auditx-draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes auditx-ring {
        to { transform: rotate(360deg); }
      }
      @keyframes auditx-pop {
        0% { opacity: 0; transform: scale(0.82) translateY(14px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
      }
      .auditx-splash__name {
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #f8fafc;
        margin: 0;
      }
      .auditx-splash__name span {
        color: #4f9bff;
      }
      .auditx-splash__tagline {
        font-family: Inter, system-ui, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #94a3b8;
        margin: 6px 0 22px;
      }
      .auditx-splash__bar {
        position: relative;
        width: 220px;
        height: 4px;
        margin: 0 auto;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.12);
        overflow: hidden;
      }
      .auditx-splash__bar::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgb(79 155 255 / 0.9), transparent);
        transform: translateX(-100%);
        animation: auditx-sweep 1.4s ease-in-out infinite;
      }
      @keyframes auditx-sweep {
        100% { transform: translateX(100%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .auditx-splash__tile,
        .auditx-splash__tile::after,
        .auditx-splash__mark path,
        .auditx-splash__bar::after {
          animation: none;
        }
        .auditx-splash__mark path {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="auditx-splash">
        <div class="auditx-splash__inner">
          <div class="auditx-splash__tile">
            <svg class="auditx-splash__mark" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="AuditX">
              <path d="M5 13 L10 18 L19 7" />
              <path d="M14 5.5 C16 5 18 5 18.5 6.5 C19 8 17.5 9.5 16 10.5" stroke="#bfdbfe" />
            </svg>
          </div>
          <p class="auditx-splash__name">Audit<span>X</span></p>
          <p class="auditx-splash__tagline">Legal Metrology Compliance Inspection</p>
          <div class="auditx-splash__bar" role="status" aria-label="Loading AuditX">
            <span class="sr-only">Loading…</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
