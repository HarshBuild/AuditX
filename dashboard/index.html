    <title>AuditX — Legal Metrology Compliance Inspection</title>
    <style>
      /* App splash shown while the single-file bundle boots; React replaces it. */
      #root:empty {
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      #root:has(.auditx-splash) {
        min-height: 100dvh;
      }
      .auditx-splash {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        background: linear-gradient(180deg, #eff6ff 0%, #ffffff 100%);
        color: #1e3a8a;
      }
      .auditx-splash__inner {
        text-align: center;
        padding: 24px;
      }
      .auditx-splash__tile {
        width: 76px;
        height: 76px;
        margin: 0 auto 16px;
        border-radius: 20px;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 45%, #1e40af 100%);
        box-shadow: 0 12px 28px -10px rgb(30 58 138 / 0.55);
        display: grid;
        place-items: center;
      }
      .auditx-splash__mark {
        width: 44px;
        height: 44px;
      }
      .auditx-splash__name {
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #172554;
        margin: 0;
      }
      .auditx-splash__name span {
        color: #2563eb;
      }
      .auditx-splash__tagline {
        font-family: Inter, system-ui, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #64748b;
        margin: 6px 0 18px;
      }
      .auditx-splash__spinner {
        width: 22px;
        height: 22px;
        border-radius: 9999px;
        border: 2px solid #bfdbfe;
        border-top-color: #2563eb;
        margin: 0 auto;
        animation: auditx-spin 0.8s linear infinite;
      }
      @keyframes auditx-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .auditx-splash__spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="auditx-splash">
        <div class="auditx-splash__inner">
          <div class="auditx-splash__tile">
            <svg class="auditx-splash__mark" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 13 L10 18 L19 7" />
              <path d="M14 5.5 C16 5 18 5 18.5 6.5 C19 8 17.5 9.5 16 10.5" stroke="#bfdbfe" />
            </svg>
          </div>
          <p class="auditx-splash__name">Audit<span>X</span></p>
          <p class="auditx-splash__tagline">Legal Metrology Compliance Inspection</p>
          <div class="auditx-splash__spinner" role="status" aria-label="Loading AuditX">
            <span class="sr-only">Loading…</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
